services:
  livebpm-postgres:
    image: postgres:17
    container_name: livebpm-postgres
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  livebpm-api:
    image: ${API_IMAGE}:${API_IMAGE_TAG}
    container_name: livebpm-api
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: Host=livebpm-postgres;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      AllowedOrigins__0: ${WEB_ORIGIN}
    depends_on:
      livebpm-postgres:
        condition: service_healthy

  livebpm-web:
    image: ${WEB_IMAGE}:${WEB_IMAGE_TAG}
    container_name: livebpm-web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT}:80"
    depends_on:
      - livebpm-api

volumes:
  postgres_data:
